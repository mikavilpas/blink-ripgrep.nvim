---
name: Run tests
on:
  pull_request: ~
  push:
    branches:
      - main
permissions:
  contents: read

env:
  # renovate: datasource=git-refs-master packageName=https://github.com/neovim/neovim
  NEOVIM_NIGHTLY_COMMIT: b091c9b0a030d78ec58022491c78489826e2763d
  MISE_TASK_RUN_AUTO_INSTALL: false
jobs:
  build-neovim-nightly:
    runs-on: ubuntu-26.04
    steps:
      - name: Build pinned Neovim nightly
        uses: mikavilpas/neovim-action/build-nightly@4f1c9a2235ee7428930602c0ba3e4f20377b61d8 # v3.3.0
        with:
          commit: ${{ env.NEOVIM_NIGHTLY_COMMIT }}

  busted:
    name: "Busted / ${{ matrix.neovim.name }}"
    runs-on: ubuntu-26.04
    needs: build-neovim-nightly
    strategy:
      fail-fast: false
      matrix:
        neovim:
          - name: nvim-stable
            version: stable
          - name: nvim-nightly
            version: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: ripgrep

      - name: Download pinned Neovim nightly
        if: matrix.neovim.version == 'nightly'
        uses: mikavilpas/neovim-action/restore-nightly@4f1c9a2235ee7428930602c0ba3e4f20377b61d8 # v3.3.0
        with:
          commit: ${{ env.NEOVIM_NIGHTLY_COMMIT }}

      - name: Install stable Neovim
        if: matrix.neovim.version == 'stable'
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        env:
          # https://github.com/rhysd/action-setup-vim/issues/80
          TMPDIR: ${{ runner.temp }}
        with:
          neovim: true
          version: stable

      - name: Run tests
        uses: mikavilpas/neovim-action/busted@4f1c9a2235ee7428930602c0ba3e4f20377b61d8 # v3.3.0

  build:
    name: "e2e ${{ matrix.neovim.name }}, ${{ matrix.blink.name }}"
    runs-on: ubuntu-26.04
    needs: build-neovim-nightly
    strategy:
      fail-fast: false
      matrix:
        neovim:
          - name: nvim-stable
            version: stable
          - name: nvim-nightly
            version: nightly
        blink:
          - name: blink-stable
            appname: nvim
          - name: blink-nightly
            appname: nvim_blink_nightly

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: ripgrep

      - name: Download pinned Neovim nightly
        if: matrix.neovim.version == 'nightly'
        uses: mikavilpas/neovim-action/restore-nightly@4f1c9a2235ee7428930602c0ba3e4f20377b61d8 # v3.3.0
        with:
          commit: ${{ env.NEOVIM_NIGHTLY_COMMIT }}

      - name: Install stable Neovim
        if: matrix.neovim.version == 'stable'
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        env:
          # https://github.com/rhysd/action-setup-vim/issues/80
          TMPDIR: ${{ runner.temp }}
        with:
          neovim: true
          version: stable

      # https://github.com/cypress-io/github-action?tab=readme-ov-file#pnpm-workspaces
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/Cypress
          key: my-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install

      # need to work around https://github.com/cypress-io/github-action/issues/1246
      - run: pnpm --filter integration-tests exec cypress install
      - name: Run end-to-end tests
        env:
          NVIM_APPNAME: ${{ matrix.blink.appname }}
        run: |
          rg --version
          pnpm tui run

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # add the line below to store screenshots only on failures
        # if: failure()
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.neovim.name }}-${{ matrix.blink.name }}
          path: integration-tests/cypress/screenshots
          if-no-files-found: ignore # 'warn' or 'error' are also available, defaults to `warn`

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - build-neovim-nightly
      - busted
      - build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Verify all required jobs succeeded
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}
        run: |
          echo "One or more required jobs did not succeed."
          exit 1
